spring:
  application:
    name: pet-service
  datasource:
    password: ${POSTGRES_PASSWORD:postgres}
    username: ${POSTGRES_USERNAME:postgres}
    name: ${POSTGRES_DB:postgres}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}
  flyway:
    password: ${POSTGRES_PASSWORD:postgres}
    user: ${POSTGRES_USERNAME:postgres}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      username: ${REDIS_USERNAME:redis}
      password: ${REDIS_PASSWORD:redis}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    keycloak:
      account: ${KEYCLOAK_ACCOUNT:account}
      realm: ${KEYCLOAK_REALM:master}
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:9990}/realms/${spring.security.keycloak.realm}/protocol/openid-connect/certs
server:
  port: ${SERVER_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: openapi.yml
management:
  metrics:
    export:
      otlp:
        enabled: false
  observations:
    annotations:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TEMPO_URL:http://localhost:4318/v1/traces}
        schedule-delay: 1s
    resource-attributes:
      service.name: ${spring.application.name:pet-service}
      service.version: ${project.version:1.0.2}
  otlp:
    metrics:
      export:
        enabled: false

  #открытие порта для /actuator/**
  server:
    port: 9091
