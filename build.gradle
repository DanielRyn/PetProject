plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.7.0'
    id 'maven-publish'
    id 'io.github.gradle-nexus.publish-plugin' version "2.0.0"
}

group = 'ru.java.device.service'
version = '0.0.1-SNAPSHOT'
description = 'pet-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:5.0.1'

    implementation 'io.swagger.core.v3:swagger-annotations:2.2.6'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.3'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    compileOnly 'org.projectlombok:lombok'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

task generateOpenApiAndBuild {
    group = 'build'

    tasks.named('compileJava') {
        dependsOn 'openApiGenerate'
    }

    tasks.named('build') {
        dependsOn 'openApiGenerate'
    }

    dependsOn 'build'
}

tasks.named('test') {
    useJUnitPlatform()
}


repositories {
    mavenCentral()
}

openApiGenerate {
    generatorName = "spring"

    inputSpec = "$projectDir/src/main/resources/static/openapi.yml"
    outputDir = "$projectDir/generated"

    apiPackage = "api"
    modelPackage = "model"

    additionalProperties = [
            library              : "spring-cloud",
            useSpringBoot3       : "true",
            dateLibrary          : "java8",
            useBeanValidation    : "true",
            performBeanValidation: "true",
            skipOverwrite        : "true"
    ]
}

nexusPublishing {
    repositories {
        nexus {
            nexusUrl = uri("http://localhost:8081")
            snapshotRepositoryUrl = uri("http://localhost:8081/repository/maven-snapshots")

            //TODO Вынести в env
            username = "admin"

            //TODO Вынести в env
            password = "17062001"
            allowInsecureProtocol = true
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs += ['generated/src/main/java']
        }
    }
}

tasks.register('petClientJar', Jar) {
    archiveBaseName.set('pet-service-client')

    from sourceSets.main.output
    include 'api/**'
    include 'model/**'
    include 'org/**'
}

publishing {
    publications {
        petClient(MavenPublication) {
            groupId group
            artifactId = 'pet-service-client'
            version = version
            artifact petClientJar
        }
    }
}
