plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.7.0'
}

group = 'ru.java.device.service'
version = '0.0.1-SNAPSHOT'
description = 'rest-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.0")
}

dependencies {
//    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
//    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation("io.swagger.core.v3:swagger-annotations:2.2.6")
    implementation("jakarta.validation:jakarta.validation-api:3.1.1")
    implementation("org.openapitools:jackson-databind-nullable:0.2.3")

    compileOnly 'org.projectlombok:lombok'
//    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.projectlombok:lombok'
//    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
//    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

openApiGenerate {
    generatorName.set('spring')

    inputSpec.set("$projectDir/src/main/resources/openapi.yml")
    outputDir.set("$projectDir/generated")

    invokerPackage.set('invoker')
    modelPackage.set('model')
    apiPackage.set('api')

    additionalProperties = [
            library: "spring-cloud",
            useSpringBoot3: "true",
            dateLibrary: "java8"
    ]
}

tasks.named('test') {
    useJUnitPlatform()
}

sourceSets {
    main {
        java.srcDir("$projectDir/generated/")
    }
}